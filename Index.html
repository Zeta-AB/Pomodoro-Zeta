<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporizador Pomodoro</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            focus: {
              DEFAULT: '#f43f5e', // Carmesí / Rosa cálido moderno
              hover: '#e11d48',
              glow: 'rgba(244, 63, 94, 0.22)',
              border: '#fb7185'
            },
            rest: {
              DEFAULT: '#10b981', // Verde esmeralda revitalizante
              hover: '#059669',
              glow: 'rgba(16, 185, 129, 0.22)',
              border: '#34d399'
            }
          },
          fontFamily: {
            signature: ['Georgia', 'Cambria', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    /* Suavizado en la animación del anillo SVG */
    #progress-circle {
      transition: stroke-dashoffset 0.85s linear, stroke 0.5s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-rose-500 selection:text-white">

  <!-- Tarjeta Contenedora Principal -->
  <main class="w-full max-w-md bg-slate-900/90 backdrop-blur-2xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden transition-all duration-700">
    
    <!-- Luces de Fondo Dinámicas -->
    <div id="ambient-glow" class="absolute -top-24 -left-24 w-80 h-80 rounded-full blur-3xl pointer-events-none transition-all duration-700 bg-focus-glow"></div>
    <div class="absolute -bottom-24 -right-24 w-72 h-72 rounded-full blur-3xl pointer-events-none bg-indigo-500/10"></div>

    <!-- ========================================== -->
    <!-- (A) ENCABEZADO DE MARCA / BRANDING Y FIRMA -->

      <div class="flex items-center gap-3">
        <!-- Espacio para LOGO (Placeholder reemplazable por <img> o Ícono personalizado) -->
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-slate-800 to-slate-700 border border-slate-600/50 flex items-center justify-center shadow-inner overflow-hidden flex-shrink-0 group">
          <img src="C:\Users\allan\Documents\ImTheZeta\Apps\Pomodoro Zeta\1920x1920.png" alt="Logo" class="w-full h-full object-cover">
          
        </div>

        <!-- Nombre de Marca y Firma Elegante -->
        <div class="flex flex-col">
          <span class="text-sm font-bold tracking-tight text-white uppercase flex items-center gap-1.5">
            Pomodoro Zeta <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">PRO</span>
          </span>
          <span class="font-signature italic text-xs text-slate-400 tracking-wide">
            By <span class="text-slate-200 font-medium hover:text-white transition">I Am The Zeta / ING: @iamthezeta</span>
          </span>
        </div>
      </div>

      <!-- Botón para alternar Panel de Configuración -->
      <button id="btn-toggle-settings" title="Configurar sonidos" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/60 transition active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
    </header>

    <!-- ========================================== -->
    <!-- (B) PANEL DESPLEGABLE: SELECTOR DE SONIDO  -->
    <!-- ========================================== -->
    <section id="settings-panel" class="relative z-10 hidden mb-6 p-4 rounded-2xl bg-slate-950/90 border border-slate-800 transition-all duration-300">
      <div class="flex items-center justify-between mb-2">
        <label for="sound-select" class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
          <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
          Tono de Notificación
        </label>
        <span class="text-[10px] text-slate-500 font-mono">Web Audio API</span>

      <div class="flex gap-2">
        <!-- Selector con al menos 3 tipos de sonidos -->

          <option value="bell">Campanilla Zen (Suave & Armónica)</option>
          <option value="beep">Beep Digital Clásico (Pulsos)</option>
          <option value="retro">Sintetizador Retro (Arcade 8-Bit)</option>

        <!-- Botón para escuchar muestra -->
        <button id="btn-test-sound" type="button" title="Probar sonido seleccionado" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium border border-slate-700 flex items-center gap-1.5 transition active:scale-95">
          <span>Probar</span>
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
    </section>

    <!-- Selector de Modos (Enfoque vs Descanso) -->
    <nav class="relative z-10 flex bg-slate-950/80 p-1 rounded-2xl border border-slate-800/80 text-sm font-semibold w-full mb-2">
      <button id="tab-work" class="flex-1 py-2 rounded-xl transition-all duration-300 text-white bg-slate-800 shadow-md">
        Enfoque (25m)
      </button>
      <button id="tab-break" class="flex-1 py-2 rounded-xl transition-all duration-300 text-slate-400 hover:text-slate-200">
        Descanso (5m)
      </button>
    </nav>

    <!-- Temporizador Circular SVG -->
    <div class="relative z-10 flex flex-col items-center justify-center my-6">
      <div class="relative flex items-center justify-center">
        <svg class="w-64 h-64 sm:w-72 sm:h-72" viewBox="0 0 280 280">
          <circle
            cx="140"
            cy="140"
            r="120"
            stroke="currentColor"
            stroke-width="10"
            class="text-slate-800/70"
            fill="transparent"
          />
          <circle
            id="progress-circle"
            cx="140"
            cy="140"
            r="120"
            stroke="currentColor"
            stroke-width="10"
            stroke-linecap="round"
            class="text-focus"
            fill="transparent"
            stroke-dasharray="753.98"
            stroke-dashoffset="0"
          />
        </svg>

        <!-- Dígitos del Temporizador y Estado -->
        <div class="absolute flex flex-col items-center text-center">
          <span id="timer-display" class="font-mono text-5xl sm:text-6xl font-black tracking-tight text-white tabular-nums drop-shadow-md">
            25:00
          </span>
          <span id="mode-badge" class="mt-2 text-xs uppercase tracking-widest font-bold px-3 py-1 rounded-full bg-slate-800 text-focus border border-focus/20 transition-colors duration-500">
            Sesión de Enfoque
          </span>
        </div>
      </div>
    </div>

    <!-- Controles Funcionales (Iniciar, Pausar, Reiniciar, Saltar) -->
    <div class="relative z-10 flex items-center justify-center gap-3">
      <!-- Botón Reiniciar -->
      <button id="btn-reset" title="Reiniciar tiempo actual" class="p-3.5 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 hover:text-white border border-slate-700/60 transition transform active:scale-95 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>

      <!-- Botón Principal: Iniciar / Pausar -->
      <button id="btn-toggle" class="flex-1 py-4 px-6 rounded-2xl bg-focus hover:bg-focus-hover font-bold text-white shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
        <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 fill-current" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 fill-current hidden" viewBox="0 0 24 24">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
        <span id="btn-toggle-text">Comenzar</span>
      </button>

      <!-- Botón Saltar Modo -->
      <button id="btn-skip" title="Saltar al siguiente periodo" class="p-3.5 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 hover:text-white border border-slate-700/60 transition transform active:scale-95 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
        </svg>
      </button>
    </div>

    <!-- Contador de Ciclos Completados con persistencia -->
    <footer class="relative z-10 mt-8 pt-5 border-t border-slate-800/80 flex items-center justify-between text-sm">
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold text-slate-400 tracking-wider uppercase">Ciclos:</span>
        <span id="cycle-badge" class="px-2.5 py-0.5 rounded-full font-extrabold text-sm bg-slate-800 text-focus border border-slate-700">0</span>
      </div>

      <div class="flex items-center gap-2">
        <div id="cycle-dots" class="flex items-center gap-1.5" title="Bloque de 4 sesiones"></div>
        <button id="btn-clear-cycles" title="Reiniciar contador de ciclos" class="text-slate-500 hover:text-slate-300 ml-1 transition p-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>
    </footer>
  </main>

  <!-- ========================================== -->
  <!-- LÓGICA JAVASCRIPT                          -->
  <!-- ========================================== -->
  <script>
    // --- 1. Constantes y Estado de la Aplicación ---
    const WORK_SECONDS = 25 * 60; // 25 minutos
    const BREAK_SECONDS = 5 * 60; // 5 minutos
    const CIRCUMFERENCE = 2 * Math.PI * 120; // 753.98 (Radio r = 120)

    let currentMode = 'work'; // 'work' | 'break'
    let totalTime = WORK_SECONDS;
    let timeLeft = WORK_SECONDS;
    let timerInterval = null;
    let isRunning = false;
    let audioCtx = null;

    // Persistencia en LocalStorage
    let completedCycles = parseInt(localStorage.getItem('pomodoro_cycles_count') || '0', 10);
    let selectedSound = localStorage.getItem('pomodoro_selected_sound') || 'bell';

    // --- 2. Elementos del DOM ---
    const timerDisplay = document.getElementById('timer-display');
    const modeBadge = document.getElementById('mode-badge');
    const progressCircle = document.getElementById('progress-circle');
    const ambientGlow = document.getElementById('ambient-glow');

    const tabWork = document.getElementById('tab-work');
    const tabBreak = document.getElementById('tab-break');

    const btnToggle = document.getElementById('btn-toggle');
    const btnToggleText = document.getElementById('btn-toggle-text');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const btnReset = document.getElementById('btn-reset');
    const btnSkip = document.getElementById('btn-skip');

    const cycleBadge = document.getElementById('cycle-badge');
    const cycleDots = document.getElementById('cycle-dots');
    const btnClearCycles = document.getElementById('btn-clear-cycles');

    const btnToggleSettings = document.getElementById('btn-toggle-settings');
    const settingsPanel = document.getElementById('settings-panel');
    const soundSelect = document.getElementById('sound-select');
    const btnTestSound = document.getElementById('btn-test-sound');

    // Inicializar geometría del círculo SVG
    progressCircle.style.strokeDasharray = `${CIRCUMFERENCE}`;
    progressCircle.style.strokeDashoffset = '0';
    soundSelect.value = selectedSound;

    // --- 3. Motor de Audio Sintetizado (Web Audio API) ---
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Genera 3 tipos distintos de sonido sin depender de archivos de audio externos
    function playSoundNotification(type = selectedSound, isBreakTransition = false) {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        if (type === 'bell') {
          // Sonido 1: Campanilla Zen (Ondas senoidales con caída suave y armónicos)
          const fundamental = isBreakTransition ? 523.25 : 659.25; // C5 o E5
          [fundamental, fundamental * 1.5].forEach((freq, index) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.2 / (index + 1), now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 1.25);
          });

        } else if (type === 'beep') {
          // Sonido 2: Beep Digital Clásico (Reloj despertador, pulsos definidos)
          const baseFreq = isBreakTransition ? 750 : 920;
          [0, 0.14].forEach((delay) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(baseFreq, now + delay);

            gain.gain.setValueAtTime(0, now + delay);
            gain.gain.linearRampToValueAtTime(0.12, now + delay + 0.01);
            gain.gain.setValueAtTime(0.12, now + delay + 0.08);
            gain.gain.linearRampToValueAtTime(0.001, now + delay + 0.09);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + delay);
            osc.stop(now + delay + 0.1);
          });

        } else if (type === 'retro') {
          // Sonido 3: Sintetizador Retro Arcade (Arpegio rápido estilo videojuego)
          const notes = isBreakTransition 
            ? [330, 392, 494, 659]  // Mi menor ascendente
            : [440, 554, 659, 880]; // La mayor triunfal

          notes.forEach((freq, idx) => {
            const startTime = now + (idx * 0.07);
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, startTime);

            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.18, startTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.12);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.13);
          });
        }
      } catch (err) {
        console.warn('AudioContext bloqueado o no soportado:', err);
      }
    }

    // --- 4. Renderizado y Temática Visual ---
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateProgressRing() {
      const progress = timeLeft / totalTime;
      const offset = CIRCUMFERENCE * (1 - progress);
      progressCircle.style.strokeDashoffset = offset;
    }

    function updateDisplay() {
      const formatted = formatTime(timeLeft);
      timerDisplay.textContent = formatted;
      const modeName = currentMode === 'work' ? 'Enfoque' : 'Descanso';
      document.title = `${formatted} (${modeName}) - Pomodoro Focus`;
      updateProgressRing();
    }

    function updateCycleUI() {
      cycleBadge.textContent = completedCycles;
      cycleDots.innerHTML = '';
      const step = completedCycles % 4;

      for (let i = 0; i < 4; i++) {
        const dot = document.createElement('span');
        const isFilled = i < step || (step === 0 && completedCycles > 0);
        const activeColor = currentMode === 'work' ? 'bg-focus shadow-focus' : 'bg-rest shadow-rest';
        dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${
          isFilled ? `${activeColor} shadow-sm` : 'bg-slate-800 border border-slate-700'
        }`;
        cycleDots.appendChild(dot);
      }
    }

    function applyTheme(mode) {
      if (mode === 'work') {
        // Enfoque: Tonos cálidos (Rosa / Carmesí)
        progressCircle.classList.remove('text-rest');
        progressCircle.classList.add('text-focus');

        ambientGlow.classList.remove('bg-rest-glow');
        ambientGlow.classList.add('bg-focus-glow');

        btnToggle.classList.remove('bg-rest', 'hover:bg-rest-hover');
        btnToggle.classList.add('bg-focus', 'hover:bg-focus-hover');

        modeBadge.className = 'mt-2 text-xs uppercase tracking-widest font-bold px-3 py-1 rounded-full bg-slate-800 text-focus border border-focus/20 transition-colors duration-500';
        modeBadge.textContent = 'Sesión de Enfoque';

        tabWork.className = 'flex-1 py-2 rounded-xl transition-all duration-300 text-white bg-slate-800 shadow-md';
        tabBreak.className = 'flex-1 py-2 rounded-xl transition-all duration-300 text-slate-400 hover:text-slate-200';
        cycleBadge.className = 'px-2.5 py-0.5 rounded-full font-extrabold text-sm bg-slate-800 text-focus border border-slate-700';
      } else {
        // Descanso: Tonos Esmeralda / Verdes
        progressCircle.classList.remove('text-focus');
        progressCircle.classList.add('text-rest');

        ambientGlow.classList.remove('bg-focus-glow');
        ambientGlow.classList.add('bg-rest-glow');

        btnToggle.classList.remove('bg-focus', 'hover:bg-focus-hover');
        btnToggle.classList.add('bg-rest', 'hover:bg-rest-hover');

        modeBadge.className = 'mt-2 text-xs uppercase tracking-widest font-bold px-3 py-1 rounded-full bg-slate-800 text-rest border border-rest/20 transition-colors duration-500';
        modeBadge.textContent = 'Pausa de Descanso';

        tabBreak.className = 'flex-1 py-2 rounded-xl transition-all duration-300 text-white bg-slate-800 shadow-md';
        tabWork.className = 'flex-1 py-2 rounded-xl transition-all duration-300 text-slate-400 hover:text-slate-200';
        cycleBadge.className = 'px-2.5 py-0.5 rounded-full font-extrabold text-sm bg-slate-800 text-rest border border-slate-700';
      }
      updateCycleUI();
    }

    // --- 5. Lógica del Temporizador y Transición Automática Continua ---
    function startTimer() {
      if (isRunning) return;
      getAudioContext(); // Desbloquear audio tras interactuar
      isRunning = true;
      iconPlay.classList.add('hidden');
      iconPause.classList.remove('hidden');
      btnToggleText.textContent = 'Pausar';

      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          // LLEGADA A 00:00 -> TRANSICIÓN AUTOMÁTICA CONTINUA
          handleTimerFinished();
        }
      }, 1000);
    }

    function pauseTimer() {
      if (!isRunning) return;
      isRunning = false;
      clearInterval(timerInterval);
      iconPlay.classList.remove('hidden');
      iconPause.classList.add('hidden');
      btnToggleText.textContent = 'Continuar';
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = totalTime;
      btnToggleText.textContent = 'Comenzar';
      updateDisplay();
    }

    function switchMode(newMode, autoStart = false) {
      pauseTimer();
      currentMode = newMode;
      totalTime = (newMode === 'work') ? WORK_SECONDS : BREAK_SECONDS;
      timeLeft = totalTime;
      applyTheme(newMode);
      updateDisplay();

      if (autoStart) {
        startTimer();
      } else {
        btnToggleText.textContent = 'Comenzar';
      }
    }

    // Función Clave: ejecuta sonido, conmuta ciclo y arranca de inmediato
    function handleTimerFinished() {
      clearInterval(timerInterval);
      isRunning = false;

      if (currentMode === 'work') {
        playSoundNotification(selectedSound, true);
        completedCycles++;
        localStorage.setItem('pomodoro_cycles_count', completedCycles);
        updateCycleUI();
        // Cambia a descanso e INICIA AUTOMÁTICAMENTE
        switchMode('break', true);
      } else {
        playSoundNotification(selectedSound, false);
        // Cambia a trabajo e INICIA AUTOMÁTICAMENTE
        switchMode('work', true);
      }
    }

    // --- 6. Event Listeners ---
    btnToggle.addEventListener('click', () => {
      if (isRunning) pauseTimer();
      else startTimer();
    });

    btnReset.addEventListener('click', resetTimer);

    btnSkip.addEventListener('click', () => {
      const nextMode = (currentMode === 'work') ? 'break' : 'work';
      switchMode(nextMode, isRunning); // Mantiene el estado activo si ya corría
    });

    tabWork.addEventListener('click', () => {
      if (currentMode !== 'work') switchMode('work', isRunning);
    });

    tabBreak.addEventListener('click', () => {
      if (currentMode !== 'break') switchMode('break', isRunning);
    });

    btnClearCycles.addEventListener('click', () => {
      if (confirm('¿Deseas reiniciar tu contador de ciclos completados?')) {
        completedCycles = 0;
        localStorage.setItem('pomodoro_cycles_count', '0');
        updateCycleUI();
      }
    });

    // Panel de Configuración y Selector de Sonidos
    btnToggleSettings.addEventListener('click', () => {
      settingsPanel.classList.toggle('hidden');
    });

    soundSelect.addEventListener('change', (e) => {
      selectedSound = e.target.value;
      localStorage.setItem('pomodoro_selected_sound', selectedSound);
    });

    btnTestSound.addEventListener('click', () => {
      playSoundNotification(selectedSound, false);
    });

    // Iniciar Aplicación
